<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quiz | Interactive Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header><div class="logo">Q.</div><div><p class="eyebrow">LEARN SOMETHING NEW</p><h1>Quick Quiz</h1></div></header>
    <section class="quiz-card">
      <div class="progress-row"><span id="questionNumber">Question 1 of 5</span><span id="scoreLabel">Score: 0</span></div>
      <div class="progress-track"><div id="progressBar"></div></div>
      <p class="category">GENERAL KNOWLEDGE</p>
      <h2 id="questionText">Loading question…</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <div class="controls"><button id="nextButton" disabled>Next question →</button></div>
    </section>
    <p class="footnote">A small practice project built with HTML, CSS, and JavaScript.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
